<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Range calculator</title>
  <link rel="icon" type="image/webp" href="favicon.webp">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body>
  <main class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Riven Stats</h1>
      </div>
      
      <div class="sidebar-section">
        <h2>Weapon Type</h2>
        <div class="btns" id="cats"></div>
      </div>

      <div class="sidebar-section">
        <h2>Stats Format</h2>
        <div class="btns" id="mults"></div>
      </div>

      <!-- Moved Screenshot Section -->
      <div class="sidebar-section">
        <h2>Screenshot</h2>
        <div class="tools">
          <input type="text" id="paste" class="paste" placeholder="Paste Screenshot to Grade"
            aria-label="Paste riven screenshot" autocomplete="off">
          <button type="button" class="btn" id="clear" hidden>Clear</button>
        </div>
        <figure class="shot" id="shotwrap" hidden>
          <img id="shot" alt="Pasted riven screenshot">
        </figure>
        <p class="count" id="status"></p>
      </div>
    </aside>

    <!-- Main Content Area (Search and List only) -->
    <section class="content">
      <div class="tools">
        <input type="search" id="q" placeholder="Search by stat:" aria-label="Search results">
      </div>
      <p class="count" id="count"></p>
      <ul id="list"></ul>
    </section>
  </main>

  <script src="ocr.js" defer></script>
  <script src="script.js" defer></script>

</body>

</html>
