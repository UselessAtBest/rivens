<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Range calculator</title>
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="new-h1">
      <h1>Riven Stats</h1>
    </div>
    <h2>Weapon Type</h2>
    <div class="btns" id="cats"></div>
    <h2>Stats Format</h2>
    <div class="btns" id="mults"></div>

    <h2>Screenshot</h2>
    <div class="tools">
      <input type="text" id="paste" class="paste" placeholder="Paste A Riven Screenshot to Grade it."
        aria-label="Paste riven screenshot" autocomplete="off">
      <button type="button" class="btn" id="clear" hidden>Clear</button>
    </div>
    <figure class="shot" id="shotwrap" hidden>
      <img id="shot" alt="Pasted riven screenshot">
    </figure>
    <p class="count" id="status"></p>

    <div class="tools"><input type="search" id="q" placeholder="Search by stat" aria-label="Search results">
    </div>
    <p class="count" id="count"></p>
    <ul id="list"></ul>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
  <script src="ocr.js" defer></script>
  <script src="script.js" defer></script>


</body>

</html>
