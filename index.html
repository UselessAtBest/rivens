<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Range calculator</title>
<style>
:root{--bg:#f3f5f2;--surface:#fff;--ink:#1c2420;--muted:#66726b;--line:#d5dcd7;--accent:#1f6b52;--accent-ink:#fff;--soft:#dfeee7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--surface:#1c2420;--ink:#e8eee9;--muted:#93a199;--line:#33403a;--accent:#5bc59c;--accent-ink:#0d1a14;--soft:#233a30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--surface:#1c2420;--ink:#e8eee9;--muted:#93a199;--line:#33403a;--accent:#5bc59c;--accent-ink:#0d1a14;--soft:#233a30;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 20px;color:var(--muted)}
h2{font-size:.95rem;margin:20px 0 8px;color:var(--muted);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;padding:9px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.btn small{color:var(--muted);margin-left:6px;font-size:.78rem}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"] small{color:inherit;opacity:.85}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:8px;margin:22px 0 12px}
input[type=search]{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.count{color:var(--muted);font-size:.85rem;margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
li{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
li em{color:var(--muted);font-style:normal;font-size:.85rem;margin-left:8px}
.empty{padding:18px 16px;color:var(--muted)}
.err{color:#c0392b}
</style>
</head>
<body>
<main>
<h1>Range calculator</h1>
<p class="sub">Pick a category and a multiplier. Search to filter the list.</p>

<h2>Category</h2>
<div class="btns" id="cats"></div>
<h2>Multiplier</h2>
<div class="btns" id="mults"></div>

<div class="tools"><input type="search" id="q" placeholder="Search by name or number" aria-label="Search results"></div>
<p class="count" id="count"></p>
<ul id="list"></ul>

</main>

<script>
var CATEGORIES = ["Rifle","Shotgun","Pistol","Archgun","Melee"];
var MULTS = [
  {label:"++",      value:0.99},
  {label:"++ / -",  value:1.2375},
  {label:"+++",     value:0.75},
  {label:"+++ / -", value:0.9375}
];
var LOW = 0.9, HIGH = 1.1, BASE = 1.2;

// Loaded from data.json (same folder as this page).
var DATA = [];

var cat = CATEGORIES[0], mult = 0;
var cats = document.getElementById("cats"), mults = document.getElementById("mults"),
    list = document.getElementById("list"), q = document.getElementById("q"),
    count = document.getElementById("count");

function fmt(n){ return (Math.round(n * 100) / 100).toString(); }

function makeGroup(parent, items, isOn, onPick){
  items.forEach(function(it, i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn";
    b.innerHTML = it.html;
    b.onclick = function(){ onPick(i); sync(); render(); };
    parent.appendChild(b);
  });
  function sync(){
    [].forEach.call(parent.children, function(b, i){
      b.setAttribute("aria-pressed", isOn(i) ? "true" : "false");
    });
  }
  sync();
}
makeGroup(cats, CATEGORIES.map(function(c){return {html:c};}),
  function(i){return CATEGORIES[i] === cat;}, function(i){cat = CATEGORIES[i];});
makeGroup(mults, MULTS.map(function(m){return {html:m.label + "<small>" + m.value + "</small>"};}),
  function(i){return i === mult;}, function(i){mult = i;});
q.oninput = render;

function render(){
  var m = MULTS[mult].value, term = q.value.trim().toLowerCase(), num = parseFloat(term);
  var rows = DATA.filter(function(d){ return d.category === cat; }).map(function(d){
    return {name:d.name, value:d.value, min:d.value * LOW * BASE * m, max:d.value * HIGH * BASE * m};
  }).filter(function(r){
    if(!term) return true;
    if(r.name.toLowerCase().indexOf(term) > -1) return true;
    if(!isNaN(num) && num >= r.min && num <= r.max) return true;
    return (fmt(r.min) + " " + fmt(r.max)).indexOf(term) > -1;
  });
  count.textContent = rows.length + (rows.length === 1 ? " result" : " results");
  list.innerHTML = "";
  if(!rows.length){
    var li = document.createElement("li");
    li.className = "empty";
    li.textContent = "Nothing matches.";
    list.appendChild(li); return;
  }
  rows.forEach(function(r){
    var li = document.createElement("li");
    var a = document.createElement("span"); a.textContent = r.name;
    var e = document.createElement("em"); e.textContent = "value " + r.value; a.appendChild(e);
    var b = document.createElement("span"); b.textContent = fmt(r.min) + " – " + fmt(r.max);
    li.appendChild(a); li.appendChild(b); list.appendChild(li);
  });
}

fetch("data.json")
  .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function(j){
    DATA = j.filter(function(d){ return d && d.name && d.category && typeof d.value === "number"; });
    render();
  })
  .catch(function(err){
    list.innerHTML = "";
    var li = document.createElement("li");
    li.className = "empty err";
    li.textContent = "Could not load data.json (" + err.message + "). Check it sits next to this page and is valid JSON.";
    list.appendChild(li);
  });
render();
</script>
</body>
</html>
